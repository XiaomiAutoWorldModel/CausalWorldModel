<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CausalWorldModel — Pages Test</title>
  <style>
    :root {
      --bg: #0f1419;
      --fg: #e7ecf1;
      --muted: #8b9aab;
      --accent: #3dd6c6;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: "SF Pro Text", "Segoe UI", system-ui, sans-serif;
      background:
        radial-gradient(ellipse 80% 60% at 20% 10%, #1a3a3a 0%, transparent 55%),
        radial-gradient(ellipse 70% 50% at 90% 80%, #1e2a4a 0%, transparent 50%),
        var(--bg);
      color: var(--fg);
    }
    main {
      max-width: 36rem;
      padding: 2rem;
      text-align: center;
    }
    .badge {
      display: inline-block;
      margin-bottom: 1rem;
      padding: 0.25rem 0.75rem;
      border: 1px solid color-mix(in srgb, var(--accent) 45%, transparent);
      border-radius: 999px;
      color: var(--accent);
      font-size: 0.75rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }
    h1 {
      margin: 0 0 0.75rem;
      font-size: clamp(1.75rem, 4vw, 2.25rem);
      font-weight: 650;
      letter-spacing: -0.02em;
    }
    p {
      margin: 0;
      color: var(--muted);
      line-height: 1.55;
    }
    code {
      color: var(--fg);
      font-size: 0.9em;
    }
  </style>
</head>
<body>
  <main>
    <div class="badge">Temporary test page</div>
    <h1>CausalWorldModel</h1>
    <p>
      GitHub Pages is reachable. Replace this file with the real project page when ready.
    </p>
    <p style="margin-top: 1rem; font-size: 0.85rem;">
      Repo: <code>XiaomiAutoWorldModel/CausalWorldModel</code>
    </p>
  </main>
</body>
</html>
